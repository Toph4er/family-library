stages:
  - test
  - build
  - security
  - deploy

variables:
  GO_VERSION: "1.27.2"

# ---- Test Stage ----

backend-test:
  stage: test
  image: golang:${GO_VERSION}-alpine
  before_script:
    - apk add --no-cache git curl bc
  script:
    - | # Retry go mod download to handle transient proxy.golang.org errors
      for i in 1 2 3; do
        go mod download && break
        echo "go mod download attempt $i failed, retrying..."
        sleep $((i * 5))
      done
    - go vet ./...
    - go test -coverpkg=github.com/Toph4er/family-library/... ./... -coverprofile=coverage.out
    - go tool cover -func=coverage.out
    - |
      TOTAL_COV=$(go tool cover -func=coverage.out | grep "total:" | awk '{print $3}' | sed 's/%//')
      if [ "$(echo "$TOTAL_COV < 15" | bc)" -eq 1 ]; then
        echo "Coverage ${TOTAL_COV}% is below the 15% threshold"
        exit 1
      fi
  artifacts:
    paths:
      - coverage.out

# ---- Build Stage ----

docker-build:
  stage: build
  image: docker:24.0
  services:
    - docker:24.0-dind
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA .
    - docker build -t $CI_REGISTRY_IMAGE:latest .
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $CI_REGISTRY_IMAGE:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ---- Security Stage ----

trivy-scan:
  stage: security
  image: alpine:3.20
  before_script:
    - apk add --no-cache curl
    - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
  script:
    - trivy fs --scanners vuln --exit-code 1 --severity HIGH,CRITICAL .
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

gosec:
  stage: security
  image: golang:${GO_VERSION}-alpine
  before_script:
    - apk add --no-cache git
    # build with x/tools>=v0.50.0: gosec upstream pins are pre-go1.27.2 export-data (V5); drop override once gosec releases against x/tools>=0.50
    - |
      mkdir -p /gosecbuild && cd /gosecbuild
      go mod init tmp/gosecbuild
      go get github.com/securego/gosec/v2/cmd/gosec@v2.29.0 golang.org/x/tools@v0.50.0
      go build -ldflags "-X main.Version=v2.29.0" -o /go/bin/gosec github.com/securego/gosec/v2/cmd/gosec
      cd $CI_PROJECT_DIR
  script:
    - | # Retry go mod download to handle transient proxy.golang.org errors
      for i in 1 2 3; do
        go mod download && break
        echo "go mod download attempt $i failed, retrying..."
        sleep $((i * 5))
      done
    - gosec -exclude-generated -exclude=G104 ./...
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

govulncheck:
  stage: security
  image: golang:${GO_VERSION}-alpine
  before_script:
    - apk add --no-cache git
    - go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
  script:
    - | # Retry go mod download to handle transient proxy.golang.org errors
      for i in 1 2 3; do
        go mod download && break
        echo "go mod download attempt $i failed, retrying..."
        sleep $((i * 5))
      done
    - govulncheck ./...
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

golangci-lint:
  stage: security
  image: golang:${GO_VERSION}-alpine
  before_script:
    - apk add --no-cache git
    - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
  script:
    - | # Retry go mod download to handle transient proxy.golang.org errors
      for i in 1 2 3; do
        go mod download && break
        echo "go mod download attempt $i failed, retrying..."
        sleep $((i * 5))
      done
    - golangci-lint run ./...
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# ---- Deploy Stage ----

deploy:
  stage: deploy
  image: docker:24.0
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
  needs:
    - backend-test
    - docker-build
    - trivy-scan
    - gosec
    - govulncheck
    - golangci-lint
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - | # Write .env to deploy directory
      mkdir -p /opt/library
      cat > /opt/library/.env << EOF
      CI_REGISTRY_IMAGE=$CI_REGISTRY_IMAGE
      CI_COMMIT_SHORT_SHA=$CI_COMMIT_SHORT_SHA
      ADMIN_USERNAME=$ADMIN_USERNAME
      ADMIN_PASSWORD=$ADMIN_PASSWORD
      SESSION_SECRET=$SESSION_SECRET
      GUEST_PASSWORD=$GUEST_PASSWORD
      LOG_LEVEL=${LOG_LEVEL:-info}
      VIRTUAL_HOST=$VIRTUAL_HOST
      HTTPS_METHOD=${HTTPS_METHOD:-noredirect}
      LETSENCRYPT_HOST=$LETSENCRYPT_HOST
      EOF
      chmod 600 /opt/library/.env
      cp compose.yaml /opt/library/compose.yaml
    - | # Deploy with health check and rollback
      cd /opt/library
      PREVIOUS_TAG=$(cat PREVIOUS_TAG 2>/dev/null || echo "")
      echo "$CI_COMMIT_SHORT_SHA" > PREVIOUS_TAG.new

      docker compose pull
      docker compose up -d --remove-orphans

      # Wait for health check
      sleep 15
      if ! docker exec library wget -qO- http://localhost:8080/health 2>/dev/null | grep -q ok; then
        echo "Health check failed, rolling back to $PREVIOUS_TAG"
        export CI_COMMIT_SHORT_SHA=$PREVIOUS_TAG
        docker compose pull
        docker compose up -d --remove-orphans
        rm -f PREVIOUS_TAG.new
      else
        mv PREVIOUS_TAG.new PREVIOUS_TAG
        echo "Deploy successful"
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
