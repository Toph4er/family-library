{{template "base" .}}

{{define "title"}}Login — Woodland Library{{end}}

{{define "content"}}
<div class="min-h-screen flex items-center justify-center py-12">
  <div class="w-full max-w-md animate-fade-in-up">
    <!-- Branding -->
    <div class="text-center mb-8">
      <svg class="w-16 h-16 text-primary mx-auto mb-4" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M21 5c-1.11-.35-2.33-.5-3.5-.5-1.95 0-4.05.4-5.5 1.5-1.45-1.1-3.55-1.5-5.5-1.5S2.45 4.9 1 6v14.65c0 .25.25.5.5.5.1 0 .15-.05.25-.05C3.1 20.45 5.05 20 6.5 20c1.95 0 4.05.4 5.5 1.5 1.35-.85 3.8-1.5 5.5-1.5 1.65 0 3.35.3 4.75 1.05.1.05.15.05.25.05.25 0 .5-.25.5-.5V6c-.6-.45-1.25-.75-2-1zm0 13.5c-1.1-.35-2.3-.5-3.5-.5-1.7 0-4.15.65-5.5 1.5V8c1.35-.85 3.8-1.5 5.5-1.5 1.2 0 2.4.15 3.5.5v11.5z" />
      </svg>
      <h1 class="text-3xl font-heading text-primary mb-2">Welcome Back</h1>
      <p class="text-text-light">Sign in to manage your library</p>
    </div>

    <!-- Login card -->
    <div class="bg-surface rounded-2xl shadow-lg p-8 border" style="border-color: rgba(139, 69, 19, 0.1);">
      <form hx-post="/api/v1/auth/login" hx-swap="innerHTML" hx-target="#login-error" hx-headers='{"Content-Type":"application/json"}'>
        
        <div class="space-y-4">
          <div>
            <label for="username" class="block text-sm font-medium text-text mb-1">Username</label>
            <input type="text" id="username" name="username" required
              class="w-full px-3 py-2.5 rounded-lg border bg-surface focus:ring-2 focus:ring-primary/20 focus:border-primary"
              style="border-color: var(--color-secondary);"
              aria-required="true"
              autocomplete="username">
          </div>
          
          <div>
            <label for="password" class="block text-sm font-medium text-text mb-1">Password</label>
            <input type="password" id="password" name="password" required
              class="w-full px-3 py-2.5 rounded-lg border bg-surface focus:ring-2 focus:ring-primary/20 focus:border-primary"
              style="border-color: var(--color-secondary);"
              aria-required="true"
              autocomplete="current-password">
          </div>
        </div>
        
        <div id="login-error" class="mt-4"></div>
        
        <button type="submit" id="login-form"
          class="w-full mt-6 px-4 py-2.5 rounded-lg font-medium text-white transition-colors"
          style="background-color: var(--color-primary);"
          onmouseenter="this.style.backgroundColor='var(--color-text-light)'"
          onmouseleave="this.style.backgroundColor='var(--color-primary)'">
          Sign In
        </button>
      </form>
    </div>

    <!-- Footer links -->
    <div class="text-center mt-6 space-y-2">
      <p class="text-text-light/60 text-sm">
        Don't have an account?
      </p>
      <a href="/guest-login" class="text-primary hover:text-text-light transition-colors font-medium text-sm no-underline">
        Guest Login →
      </a>
    </div>
  </div>
</div>

<script>
  // Serialize form data to JSON before sending
  document.querySelector('form[hx-post="/api/v1/auth/login"]').addEventListener('htmx:configRequest', function(event) {
    var form = event.detail.pathInfo.form;
    var data = new FormData(form);
    var json = {};
    data.forEach(function(value, key) { json[key] = value; });
    event.detail.parameters = JSON.stringify(json);
  });

  document.querySelector('form[hx-post="/api/v1/auth/login"]').addEventListener('htmx:afterRequest', function(event) {
    if (event.detail.failed) {
      var resp = event.detail.xhr?.response;
      var msg = 'Invalid credentials';
      try {
        var data = JSON.parse(resp);
        msg = data.error || msg;
      } catch(e) {}
      document.getElementById('login-error').innerHTML = 
        '<div class="p-3 rounded-lg bg-error/10 border border-error/20 text-error text-sm" role="alert">' + msg + '</div>';
    } else {
      // Success - redirect to books page
      window.location.href = '/books';
    }
  });
</script>
{{end}}
