run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - revive
    - unconvert

linters-settings:
  revive:
    rules:
      - name: package-comments
        disabled: true

issues:
  exclude-rules:
    # Exclude some linters from running on tests
    - path: _test\.go
      linters:
        - govet
        - revive
        - errcheck
        - unconvert
    # Exclude duplicate code in test files
    - path: tests/
      linters:
        - dupl
  max-issues-per-linter: 50
  max-same-issues: 10
