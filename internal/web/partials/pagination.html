{{define "partials/pagination"}}
{{if gt .TotalPages 1}}
<div class="flex items-center justify-between mt-6 pt-4 border-t" style="border-color: rgba(139, 69, 19, 0.1);">
  <p class="text-text-light/60 text-sm">
    Showing {{.StartItem}}-{{.EndItem}} of {{.Total}} results
  </p>
  <div class="flex gap-2">
    {{if gt .Page 1}}
    <a href="?page={{sub .Page 1}}"
      hx-get="?page={{sub .Page 1}}"
      hx-target="#book-grid"
      hx-swap="innerHTML"
      class="px-3 py-1.5 rounded-lg border text-primary hover:bg-primary hover:text-white transition-colors no-underline text-sm"
      style="border-color: var(--color-primary);">
      ← Prev
    </a>
    {{end}}
    
    {{range seq .TotalPages}}
    {{if eq . $.Page}}
    <span class="px-3 py-1.5 rounded-lg bg-primary text-white text-sm font-medium">{{.}}</span>
    {{else}}
    <a href="?page={{.}}"
      hx-get="?page={{.}}"
      hx-target="#book-grid"
      hx-swap="innerHTML"
      class="px-3 py-1.5 rounded-lg border text-primary hover:bg-primary hover:text-white transition-colors no-underline text-sm"
      style="border-color: var(--color-primary);">
      {{.}}
    </a>
    {{end}}
    {{end}}
    
    {{if lt .Page .TotalPages}}
    <a href="?page={{add .Page 1}}"
      hx-get="?page={{add .Page 1}}"
      hx-target="#book-grid"
      hx-swap="innerHTML"
      class="px-3 py-1.5 rounded-lg border text-primary hover:bg-primary hover:text-white transition-colors no-underline text-sm"
      style="border-color: var(--color-primary);">
      Next →
    </a>
    {{end}}
  </div>
</div>
{{end}}
{{end}}
