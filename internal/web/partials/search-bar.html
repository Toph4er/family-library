{{define "partials/search-bar"}}
<form hx-get="/books" hx-target="#main-content" hx-swap="innerHTML" hx-push-url="true" class="relative">
  <input type="text"
    name="q"
    value="{{.CurrentQuery}}"
    placeholder="Search books…"
    class="w-full px-4 py-2.5 rounded-lg border bg-surface pl-10 border-secondary"
    aria-label="Search books">
  <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-text-light/50 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
    <circle cx="11" cy="11" r="8"/>
    <path d="m21 21-4.35-4.35"/>
  </svg>
  <button type="submit" class="absolute right-3 top-1/2 -translate-y-1/2 text-text-light/60 hover:text-primary transition-colors" aria-label="Search">
    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <circle cx="11" cy="11" r="8"/>
      <path d="m21 21-4.35-4.35"/>
    </svg>
  </button>
</form>
{{end}}
