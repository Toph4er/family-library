{{define "partials/user-row"}}
<tr class="border-b" style="border-color: color-mix(in srgb, var(--color-secondary) 10%, transparent);">
  <td class="py-3 px-4">
    <span class="font-medium text-primary">{{.username}}</span>
  </td>
  <td class="py-3 px-4 text-text-light">{{.display_name}}</td>
  <td class="py-3 px-4">
    <span class="mushroom-tag {{if eq .role "admin"}}bg-primary/20 text-primary{{else}}bg-accent/20 text-text-light{{end}}">{{.role}}</span>
  </td>
  <td class="py-3 px-4 text-text-light/60 text-sm">{{.created_at}}</td>
  <td class="py-3 px-4">
    <div class="flex items-center gap-2">
      <button type="button"
        data-modal-url="/settings/users/{{.id}}/edit"
        class="open-settings-modal-btn text-text-light/60 hover:text-primary transition-colors"
        aria-label="Edit user {{.username}}"
      >
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>
          <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
        </svg>
      </button>
      {{if ne .username "current"}}
      <button type="button"
        hx-delete="/settings/users/{{.id}}"
        hx-confirm="Delete user {{.username}}?"
        hx-target="closest tr"
        hx-swap="outerHTML"
        class="text-text-light/60 hover:text-error transition-colors"
        aria-label="Delete user {{.username}}"
      >
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
        </svg>
      </button>
      {{end}}
    </div>
  </td>
</tr>
{{end}}
