{{define "partials/book-form"}}
<form hx-post="{{.ActionURL}}" hx-swap="outerHTML" hx-target="#error-container" hx-indicator="#loading-indicator">
  <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
  
  <div class="space-y-4">
    <!-- Basic fields -->
    <div>
      <label for="title" class="block text-sm font-medium text-text mb-1">Title <span class="text-error" aria-hidden="true">*</span></label>
      <input type="text" id="title" name="title" value="{{.Title}}" required class="w-full px-3 py-2 rounded-lg border bg-surface" style="border-color: var(--color-secondary);" aria-required="true">
    </div>
    
    <div>
      <label for="subtitle" class="block text-sm font-medium text-text mb-1">Subtitle</label>
      <input type="text" id="subtitle" name="subtitle" value="{{.Subtitle}}" class="w-full px-3 py-2 rounded-lg border bg-surface" style="border-color: var(--color-secondary);">
    </div>
    
    <div>
      <label for="authors" class="block text-sm font-medium text-text mb-1">Authors</label>
      <input type="text" id="authors" name="authors" value="{{.Authors}}" placeholder="e.g., J.K. Rowling" class="w-full px-3 py-2 rounded-lg border bg-surface" style="border-color: var(--color-secondary);">
    </div>
    
    <div>
      <label for="illustrators" class="block text-sm font-medium text-text mb-1">Illustrators</label>
      <input type="text" id="illustrators" name="illustrators" value="{{.Illustrators}}" class="w-full px-3 py-2 rounded-lg border bg-surface" style="border-color: var(--color-secondary);">
    </div>
    
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label for="isbn" class="block text-sm font-medium text-text mb-1">ISBN</label>
        <input type="text" id="isbn" name="isbn" value="{{.ISBN}}" placeholder="978-0-12345-678-9" class="w-full px-3 py-2 rounded-lg border bg-surface" style="border-color: var(--color-secondary);">
      </div>
      <div>
        <label for="publisher" class="block text-sm font-medium text-text mb-1">Publisher</label>
        <input type="text" id="publisher" name="publisher" value="{{.Publisher}}" class="w-full px-3 py-2 rounded-lg border bg-surface" style="border-color: var(--color-secondary);">
      </div>
    </div>
    
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label for="publication_year" class="block text-sm font-medium text-text mb-1">Publication Year</label>
        <input type="number" id="publication_year" name="publication_year" value="{{.PublicationYear}}" min="1000" max="2100" class="w-full px-3 py-2 rounded-lg border bg-surface" style="border-color: var(--color-secondary);">
      </div>
      <div>
        <label for="page_count" class="block text-sm font-medium text-text mb-1">Page Count</label>
        <input type="number" id="page_count" name="page_count" value="{{.PageCount}}" min="1" class="w-full px-3 py-2 rounded-lg border bg-surface" style="border-color: var(--color-secondary);">
      </div>
    </div>
    
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label for="book_type" class="block text-sm font-medium text-text mb-1">Book Type</label>
        <select id="book_type" name="book_type" class="w-full px-3 py-2 rounded-lg border bg-surface" style="border-color: var(--color-secondary);">
          <option value="">Select...</option>
          <option value="hardback" {{if eq .BookType "hardback"}}selected{{end}}>Hardback</option>
          <option value="paperback" {{if eq .BookType "paperback"}}selected{{end}}>Paperback</option>
          <option value="board_book" {{if eq .BookType "board_book"}}selected{{end}}>Board Book</option>
          <option value="ebook" {{if eq .BookType "ebook"}}selected{{end}}>E-book</option>
          <option value="audiobook" {{if eq .BookType "audiobook"}}selected{{end}}>Audiobook</option>
          <option value="other" {{if eq .BookType "other"}}selected{{end}}>Other</option>
        </select>
      </div>
      <div>
        <label for="condition" class="block text-sm font-medium text-text mb-1">Condition</label>
        <select id="condition" name="condition" class="w-full px-3 py-2 rounded-lg border bg-surface" style="border-color: var(--color-secondary);">
          <option value="">Select...</option>
          <option value="new" {{if eq .Condition "new"}}selected{{end}}>New</option>
          <option value="like_new" {{if eq .Condition "like_new"}}selected{{end}}>Like New</option>
          <option value="good" {{if eq .Condition "good"}}selected{{end}}>Good</option>
          <option value="fair" {{if eq .Condition "fair"}}selected{{end}}>Fair</option>
          <option value="poor" {{if eq .Condition "poor"}}selected{{end}}>Poor</option>
          <option value="damaged" {{if eq .Condition "damaged"}}selected{{end}}>Damaged</option>
        </select>
      </div>
    </div>
    
    <!-- Tag inputs -->
    <div>
      <label for="genres" class="block text-sm font-medium text-text mb-1">Genres</label>
      <input type="text" id="genres" name="genres" value="{{.Genres}}" placeholder="Fantasy, Adventure (comma-separated)" class="w-full px-3 py-2 rounded-lg border bg-surface" style="border-color: var(--color-secondary);">
    </div>
    
    <div>
      <label for="themes" class="block text-sm font-medium text-text mb-1">Themes</label>
      <input type="text" id="themes" name="themes" value="{{.Themes}}" placeholder="Family, Courage (comma-separated)" class="w-full px-3 py-2 rounded-lg border bg-surface" style="border-color: var(--color-secondary);">
    </div>
    
    <div>
      <label for="awards" class="block text-sm font-medium text-text mb-1">Awards</label>
      <input type="text" id="awards" name="awards" value="{{.Awards}}" placeholder="Newbery Medal (comma-separated)" class="w-full px-3 py-2 rounded-lg border bg-surface" style="border-color: var(--color-secondary);">
    </div>
    
    <div>
      <label for="reading_levels" class="block text-sm font-medium text-text mb-1">Reading Levels</label>
      <input type="text" id="reading_levels" name="reading_levels" value="{{.ReadingLevels}}" placeholder="Ages 6-8, Grade 1 (comma-separated)" class="w-full px-3 py-2 rounded-lg border bg-surface" style="border-color: var(--color-secondary);">
    </div>
    
    <!-- Child rating -->
    <div>
      <label class="block text-sm font-medium text-text mb-1">Child Rating</label>
      <div class="flex items-center gap-1">
        {{range seq 5}}
        <button type="button"
          class="text-2xl {{if le . .ChildRating}}text-accent{{else}}text-text-light/30{{end}}"
          data-rating="{{.}}"
          aria-label="Rate {{.}} star{{if gt . 1}}s{{end}}"
          hx-post="/api/v1/books/rate-child"
          hx-vals='{"rating": {{.}}}'
          hx-target="none"
        ><svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg></button>
        {{end}}
      </div>
    </div>
    
    <!-- ISBN lookup -->
    <div>
      <button type="button"
        id="isbn-lookup-btn"
        class="text-primary hover:text-text-light transition-colors font-medium text-sm no-underline"
        hx-post="/api/v1/books/lookup-isbn"
        hx-vals='{"isbn": document.getElementById("isbn").value}'
        hx-target="#isbn-lookup-result"
        hx-indicator="#isbn-lookup-btn .htmx-indicator"
      >
        <svg class="w-4 h-4 inline-block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg> Lookup ISBN
        <span class="htmx-indicator inline-block ml-2">⟳</span>
      </button>
      <div id="isbn-lookup-result" class="mt-1 text-sm text-text-light"></div>
    </div>
    
    <!-- Advanced section -->
    <div>
      <button type="button"
        data-collapse-trigger="advanced-section"
        aria-expanded="false"
        class="text-primary hover:text-text-light transition-colors font-medium text-sm no-underline"
      >
        Advanced Options ▾
      </button>
      <div id="advanced-section" hidden class="mt-4 space-y-4 pt-4 border-t" style="border-color: color-mix(in srgb, var(--color-secondary) 10%, transparent);">
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label for="gift_from" class="block text-sm font-medium text-text mb-1">Gift From</label>
            <input type="text" id="gift_from" name="gift_from" value="{{.GiftFrom}}" class="w-full px-3 py-2 rounded-lg border bg-surface" style="border-color: var(--color-secondary);">
          </div>
          <div>
            <label for="gift_relationship" class="block text-sm font-medium text-text mb-1">Relationship</label>
            <input type="text" id="gift_relationship" name="gift_relationship" value="{{.GiftRelationship}}" class="w-full px-3 py-2 rounded-lg border bg-surface" style="border-color: var(--color-secondary);">
          </div>
        </div>
        <div>
          <label for="date_received" class="block text-sm font-medium text-text mb-1">Date Received</label>
          <input type="date" id="date_received" name="date_received" value="{{.DateReceived}}" class="w-full px-3 py-2 rounded-lg border bg-surface" style="border-color: var(--color-secondary);">
        </div>
        <div>
          <label for="location" class="block text-sm font-medium text-text mb-1">Location</label>
          <input type="text" id="location" name="location" value="{{.Location}}" placeholder="e.g., Living room shelf" class="w-full px-3 py-2 rounded-lg border bg-surface" style="border-color: var(--color-secondary);">
        </div>
        <div>
          <label for="cover_image_url" class="block text-sm font-medium text-text mb-1">Cover Image URL</label>
          <input type="url" id="cover_image_url" name="cover_image_url" value="{{.CoverImageURL}}" class="w-full px-3 py-2 rounded-lg border bg-surface" style="border-color: var(--color-secondary);">
        </div>
        <div>
          <label for="notes" class="block text-sm font-medium text-text mb-1">Notes</label>
          <textarea id="notes" name="notes" rows="3" class="w-full px-3 py-2 rounded-lg border bg-surface" style="border-color: var(--color-secondary);">{{.Notes}}</textarea>
        </div>
      </div>
    </div>
  </div>
  
  <div id="error-container" class="mt-4"></div>
  <div id="loading-indicator" class="htmx-indicator mt-4 text-center">
    <span class="animate-gentle-pulse">Saving...</span>
  </div>
  
  <div class="flex justify-end gap-3 mt-6">
    <a href="{{.CancelURL}}" class="px-4 py-2 rounded-lg border text-text-light hover:text-text transition-colors no-underline" style="border-color: var(--color-secondary);">Cancel</a>
    <button type="submit" class="px-4 py-2 rounded-lg font-medium text-white" style="background-color: var(--color-primary);">
      {{if .IsEdit}}Save Changes{{else}}Add Book{{end}}
    </button>
  </div>
</form>
{{end}}
