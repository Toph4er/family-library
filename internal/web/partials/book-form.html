{{define "partials/book-form"}}
<form hx-post="{{.ActionURL}}" hx-swap="outerHTML" hx-target="#error-container" hx-indicator="#loading-indicator">
  <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
  
  <div class="space-y-4">
    <!-- ISBN (first field - lookup auto-fills the rest) -->
    <div>
      <label for="isbn" class="block text-sm font-medium text-text mb-1">ISBN</label>
      <div class="flex gap-2">
        <input type="text" id="isbn" name="isbn" value="{{.ISBN}}" placeholder="978-0-12345-678-9" class="flex-1 px-3 py-2 rounded-lg border bg-surface border-secondary">
        <button type="button" id="isbn-lookup-btn"
          class="bg-primary text-white p-2 rounded-lg hover:opacity-90 transition-opacity shrink-0"
          aria-label="Lookup ISBN">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
        <button type="button" id="isbn-scan-btn"
          class="bg-secondary text-white p-2 rounded-lg hover:opacity-90 transition-opacity shrink-0"
          aria-label="Scan ISBN">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7V5a2 2 0 012-2h2M17 3h2a2 2 0 012 2v2M21 17v2a2 2 0 01-2 2h-2M7 21H5a2 2 0 01-2-2v-2"/></svg>
        </button>
      </div>
      <div id="isbn-lookup-status" class="mt-1 text-sm hidden" role="status" aria-live="polite"></div>
    </div>

    <!-- Title + Publisher (responsive grid) -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div>
        <label for="title" class="block text-sm font-medium text-text mb-1">Title <span class="text-error" aria-hidden="true">*</span></label>
        <input type="text" id="title" name="title" value="{{.Title}}" required class="w-full px-3 py-2 rounded-lg border bg-surface border-secondary" aria-required="true">
      </div>
      <div>
        <label for="publisher" class="block text-sm font-medium text-text mb-1">Publisher</label>
        <input type="text" id="publisher" name="publisher" value="{{.Publisher}}" class="w-full px-3 py-2 rounded-lg border bg-surface border-secondary">
      </div>
    </div>

    <div>
      <label for="subtitle" class="block text-sm font-medium text-text mb-1">Subtitle</label>
      <input type="text" id="subtitle" name="subtitle" value="{{.Subtitle}}" class="w-full px-3 py-2 rounded-lg border bg-surface border-secondary">
    </div>

    <div>
      <label for="authors" class="block text-sm font-medium text-text mb-1">Authors</label>
      <input type="text" id="authors" name="authors" value="{{.Authors}}" placeholder="e.g., J.K. Rowling" class="w-full px-3 py-2 rounded-lg border bg-surface border-secondary">
    </div>

    <div>
      <label for="illustrators" class="block text-sm font-medium text-text mb-1">Illustrators</label>
      <input type="text" id="illustrators" name="illustrators" value="{{.Illustrators}}" class="w-full px-3 py-2 rounded-lg border bg-surface border-secondary">
    </div>
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label for="publication_year" class="block text-sm font-medium text-text mb-1">Publication Year</label>
        <input type="number" id="publication_year" name="publication_year" value="{{.PublicationYear}}" min="1000" max="2100" class="w-full px-3 py-2 rounded-lg border bg-surface border-secondary">
      </div>
      <div>
        <label for="page_count" class="block text-sm font-medium text-text mb-1">Page Count</label>
        <input type="number" id="page_count" name="page_count" value="{{.PageCount}}" min="1" class="w-full px-3 py-2 rounded-lg border bg-surface border-secondary">
      </div>
    </div>
    
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label for="book_type" class="block text-sm font-medium text-text mb-1">Book Type</label>
        <select id="book_type" name="book_type" class="w-full px-3 py-2 rounded-lg border bg-surface border-secondary">
          <option value="">Select...</option>
          <option value="hardback" {{if eq .BookType "hardback"}}selected{{end}}>Hardback</option>
          <option value="paperback" {{if eq .BookType "paperback"}}selected{{end}}>Paperback</option>
          <option value="board_book" {{if eq .BookType "board_book"}}selected{{end}}>Board Book</option>
          <option value="ebook" {{if eq .BookType "ebook"}}selected{{end}}>E-book</option>
          <option value="audiobook" {{if eq .BookType "audiobook"}}selected{{end}}>Audiobook</option>
          <option value="other" {{if eq .BookType "other"}}selected{{end}}>Other</option>
        </select>
      </div>
      <div>
        <label for="condition" class="block text-sm font-medium text-text mb-1">Condition</label>
        <select id="condition" name="condition" class="w-full px-3 py-2 rounded-lg border bg-surface border-secondary">
          <option value="">Select...</option>
          <option value="new" {{if eq .Condition "new"}}selected{{end}}>New</option>
          <option value="like_new" {{if eq .Condition "like_new"}}selected{{end}}>Like New</option>
          <option value="good" {{if eq .Condition "good"}}selected{{end}}>Good</option>
          <option value="fair" {{if eq .Condition "fair"}}selected{{end}}>Fair</option>
          <option value="poor" {{if eq .Condition "poor"}}selected{{end}}>Poor</option>
          <option value="damaged" {{if eq .Condition "damaged"}}selected{{end}}>Damaged</option>
        </select>
      </div>
    </div>
    
    <!-- Tag inputs -->
    <div>
      <label for="genres" class="block text-sm font-medium text-text mb-1">Genres</label>
      <input type="text" id="genres" name="genres" value="{{.Genres}}" placeholder="Fantasy, Adventure (comma-separated)" class="w-full px-3 py-2 rounded-lg border bg-surface border-secondary">
    </div>
    
    <div>
      <label for="themes" class="block text-sm font-medium text-text mb-1">Themes</label>
      <input type="text" id="themes" name="themes" value="{{.Themes}}" placeholder="Family, Courage (comma-separated)" class="w-full px-3 py-2 rounded-lg border bg-surface border-secondary">
    </div>
    
    <div>
      <label for="awards" class="block text-sm font-medium text-text mb-1">Awards</label>
      <input type="text" id="awards" name="awards" value="{{.Awards}}" placeholder="Newbery Medal (comma-separated)" class="w-full px-3 py-2 rounded-lg border bg-surface border-secondary">
    </div>
    
    <div>
      <label for="reading_levels" class="block text-sm font-medium text-text mb-1">Reading Levels</label>
      <input type="text" id="reading_levels" name="reading_levels" value="{{.ReadingLevels}}" placeholder="Ages 6-8, Grade 1 (comma-separated)" class="w-full px-3 py-2 rounded-lg border bg-surface border-secondary">
    </div>
    
    <!-- Child rating -->
    <div>
      <label class="block text-sm font-medium text-text mb-1">Child Rating</label>
      <div class="flex items-center gap-1">
        {{range seq 1 5}}
        <button type="button"
          class="text-2xl {{if le . $.ChildRating}}text-accent{{else}}text-text-light/30{{end}}"
          data-rating="{{.}}"
          aria-label="Rate {{.}} star{{if gt . 1}}s{{end}}"
          hx-post="/api/v1/books/rate-child"
          hx-vals='{"book_id": {{$.BookID}}, "rating": {{.}}}'
          hx-swap="none"
        >{{template "partials/star-icon" (dict "Class" "w-5 h-5")}}</button>
        {{end}}
      </div>
    </div>
    
    <!-- Advanced fields -->
    <div class="space-y-4">
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label for="gift_from" class="block text-sm font-medium text-text mb-1">Gift From</label>
            <input type="text" id="gift_from" name="gift_from" value="{{.GiftFrom}}" class="w-full px-3 py-2 rounded-lg border bg-surface border-secondary">
          </div>
          <div>
            <label for="gift_relationship" class="block text-sm font-medium text-text mb-1">Relationship</label>
            <input type="text" id="gift_relationship" name="gift_relationship" value="{{.GiftRelationship}}" class="w-full px-3 py-2 rounded-lg border bg-surface border-secondary">
          </div>
        </div>
        <div>
          <label for="date_received" class="block text-sm font-medium text-text mb-1">Date Received</label>
          <input type="date" id="date_received" name="date_received" value="{{.DateReceived}}" class="w-full px-3 py-2 rounded-lg border bg-surface border-secondary">
        </div>
        <div>
          <label for="location" class="block text-sm font-medium text-text mb-1">Location</label>
          <input type="text" id="location" name="location" value="{{.Location}}" placeholder="e.g., Living room shelf" class="w-full px-3 py-2 rounded-lg border bg-surface border-secondary">
        </div>
        <div>
          <label for="cover_image_url" class="block text-sm font-medium text-text mb-1">Cover Image URL</label>
          <input type="url" id="cover_image_url" name="cover_image_url" value="{{.CoverImageURL}}" class="w-full px-3 py-2 rounded-lg border bg-surface border-secondary">
        </div>
        <div>
          <label for="notes" class="block text-sm font-medium text-text mb-1">Notes</label>
          <textarea id="notes" name="notes" rows="3" class="w-full px-3 py-2 rounded-lg border bg-surface border-secondary">{{.Notes}}</textarea>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Scanner modal -->
  <div id="scanner-modal" class="modal-backdrop modal-hidden">
    <div class="modal-content modal-sm p-6" role="dialog" aria-modal="true">
      <div class="flex items-center justify-between mb-4 pb-3 border-b border-secondary/10">
        <h2 class="text-xl font-heading font-semibold text-primary">Scan ISBN</h2>
        <button type="button" id="scanner-close-btn" class="text-text-light hover:text-text transition-colors text-2xl no-underline" aria-label="Close modal">×</button>
      </div>
      <div id="scanner-viewfinder" class="w-full h-48 bg-background rounded-lg flex items-center justify-center mb-4">
        <p class="text-text-light/60 text-sm">Initializing camera...</p>
      </div>
      <div class="flex justify-end gap-3">
        <button type="button" id="scanner-cancel-btn" class="px-4 py-2 rounded-lg border border-secondary text-text-light hover:text-text transition-colors no-underline">Cancel</button>
      </div>
    </div>
  </div>

  <div id="error-container" class="mt-4"></div>
  <div id="loading-indicator" class="htmx-indicator mt-4 text-center">
    <span class="animate-gentle-pulse">Saving...</span>
  </div>
  
  <div class="flex justify-end gap-3 mt-6">
    <a href="{{.CancelURL}}" class="px-4 py-2 rounded-lg border text-text-light hover:text-text transition-colors no-underline border-secondary">Cancel</a>
    <button type="submit" class="px-4 py-2 rounded-lg font-medium text-white bg-primary">
      {{if .IsEdit}}Save Changes{{else}}Add Book{{end}}
    </button>
  </div>
</form>

<script nonce="{{ .Nonce }}">
function showStatus(msg, isError) {
  var el = document.getElementById('isbn-lookup-status');
  if (!el) return;
  el.textContent = msg;
  el.className = 'mt-1 text-sm ' + (isError ? 'text-error' : 'text-success');
  el.classList.remove('hidden');
}

function lookupISBN() {
  var isbn = document.getElementById('isbn').value.trim();
  if (!isbn) { showStatus('Please enter an ISBN', true); return; }
  var btn = document.getElementById('isbn-lookup-btn');
  btn.disabled = true;
  btn.innerHTML = '<svg class="w-5 h-5 animate-spin" viewBox="0 0 24 24" fill="none"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>';
  fetch('/api/v1/books/lookup-isbn?isbn=' + encodeURIComponent(isbn), {
    headers: { 'X-CSRF-Token': document.querySelector('input[name="csrf_token"]').value }
  })
  .then(function(r) {
    if (!r.ok) throw new Error('Lookup failed (' + r.status + ')');
    return r.json();
  })
  .then(function(data) {
    if (data.success || data.title) { populateForm(data); showStatus('Book data loaded!', false); }
    else { showStatus(data.error || 'Lookup failed', true); }
  })
  .catch(function(err) { showStatus(err.message, true); })
  .finally(function() {
    btn.disabled = false;
    btn.innerHTML = '<svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>';
  });
}

function populateForm(data) {
  var fields = ['title','subtitle','authors','illustrators','publisher','publication_year','page_count','book_type','genres','themes','cover_image_url'];
  fields.forEach(function(f) {
    var el = document.getElementById(f);
    if (el && data[f] !== undefined && data[f] !== null && data[f] !== '') el.value = data[f];
  });
}

var html5QrcodeScanner = null;

function openScannerModal() {
  document.getElementById('scanner-modal').classList.remove('modal-hidden');
  initScanner();
}

function closeScannerModal() {
  document.getElementById('scanner-modal').classList.add('modal-hidden');
  if (html5QrcodeScanner) {
    html5QrcodeScanner.stop().catch(function(){});
    html5QrcodeScanner = null;
  }
}

function onScanSuccess(decodedText) {
  var isbn = decodedText.replace(/[^0-9Xx]/g, '');
  if (isbn.length >= 10) {
    document.getElementById('isbn').value = isbn;
    closeScannerModal();
    lookupISBN();
  }
}

function initScanner() {
  if (typeof Html5Qrcode === 'undefined') {
    var script = document.createElement('script');
    script.src = 'https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js';
    script.onload = function() { startScanner(); };
    script.onerror = function() {
      document.getElementById('scanner-viewfinder').innerHTML = '<p class="text-text-light/60 text-sm">Camera library unavailable</p>';
    };
    document.head.appendChild(script);
  } else {
    startScanner();
  }
}

function startScanner() {
  html5QrcodeScanner = new Html5Qrcode('scanner-viewfinder');
  html5QrcodeScanner.start(
    { facingMode: 'environment' },
    { fps: 10, qrbox: { width: 250, height: 150 } },
    onScanSuccess,
    function() {}
  ).catch(function(err) {
    document.getElementById('scanner-viewfinder').innerHTML = '<p class="text-text-light/60 text-sm">Camera not available — enter ISBN manually</p>';
  });
}

document.addEventListener('DOMContentLoaded', function() {
  // ISBN lookup button
  var lookupBtn = document.getElementById('isbn-lookup-btn');
  if (lookupBtn) {
    lookupBtn.addEventListener('click', function() { lookupISBN(); });
  }

  // ISBN scan button
  var scanBtn = document.getElementById('isbn-scan-btn');
  if (scanBtn) {
    scanBtn.addEventListener('click', function() { openScannerModal(); });
  }

  // ISBN input: Enter key triggers lookup
  var isbnInput = document.getElementById('isbn');
  if (isbnInput) {
    isbnInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') { e.preventDefault(); lookupISBN(); }
    });
  }

  // Scanner modal: close button (×)
  var closeBtn = document.getElementById('scanner-close-btn');
  if (closeBtn) {
    closeBtn.addEventListener('click', function() { closeScannerModal(); });
  }

  // Scanner modal: cancel button
  var cancelBtn = document.getElementById('scanner-cancel-btn');
  if (cancelBtn) {
    cancelBtn.addEventListener('click', function() { closeScannerModal(); });
  }

  // Scanner modal: backdrop click closes
  var modal = document.getElementById('scanner-modal');
  if (modal) {
    modal.addEventListener('click', function(e) {
      if (e.target === modal) { closeScannerModal(); }
    });
  }
});
</script>
{{end}}
